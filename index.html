<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuchibol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a club's matchday app: proud, plain, one thumb
   IDEA: football club website (match centre, standings, player page) for a weekly pickup group
   PICTURE: night-pitch photography heroes under a navy veil; real pitch as the board
   COLOUR/TYPE: navy #0B1736, sky #4EA8FF, white cards on cool grey; Anton display + Inter
   LAYOUT: 480px phone column, photo hero per tab, overlapping cards, bottom tabs, sheets */
:root{color-scheme:light;--navy:#0B1736;--navy2:#13234A;--sky:#4EA8FF;--sky-soft:#EAF4FF;--bg:#F3F5F9;--ink:#0B1736;--mute:#5B6680;--line:#E1E6EF;--ok:#1E7A4A;--ok-soft:#E3F4EA;--bad:#B42318;--bad-soft:#FDECEA;--warn:#8A5A00;--warn-soft:#FFF4DB}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#dfe4ee;color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{margin:0}
.d{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.3px;line-height:1}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:96px;position:relative}
/* hero */
.hero{position:relative;color:#fff;overflow:hidden;background:var(--navy)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,23,54,.35) 0%,rgba(11,23,54,.1) 30%,rgba(11,23,54,.45) 65%,rgba(11,23,54,.94) 100%)}
.hero>.in{position:relative;z-index:1;padding:14px 18px 22px}
.top{display:flex;align-items:center;gap:10px}
.top .sp{flex:1}
.brand{font-size:22px}
.kick{font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--sky);text-transform:uppercase}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px;background:#E8EDF6;color:var(--navy);overflow:hidden}
.av.sky{background:var(--sky);color:var(--navy)}
.av.lg{width:96px;height:96px;border-radius:24px;font-size:36px;font-family:Anton,sans-serif;font-weight:400;background:var(--navy2);color:#fff;border:2px solid var(--sky)}
.av.sm{width:28px;height:28px;font-size:10px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;text-align:center;gap:6px}
.kit{width:52px;height:52px;margin:0 auto;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.kit.N{background:#111}.kit.B{background:#fff;border-color:var(--sky)}
.tname{font-size:22px;margin-top:8px}
.ghostbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1.5px solid rgba(255,255,255,.45);background:rgba(11,23,54,.35);backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:700}
/* cards */
.card{background:#fff;border-radius:20px;padding:16px;margin:14px 16px 0;box-shadow:0 1px 2px rgba(11,23,54,.05)}
.card.lift{margin-top:-22px;position:relative;z-index:2;box-shadow:0 8px 24px rgba(11,23,54,.12)}
.card h3{font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-size:13px;font-weight:600;color:var(--mute)}
.muted{color:var(--mute)}.s{font-size:14px}.xs{font-size:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:99px;background:var(--navy);transition:width .5s}
.bar.g i{background:#1E9E5A}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;background:var(--sky);color:var(--navy);font-weight:800;font-size:17px;margin-top:14px}
.btn:disabled{opacity:.45}
.btn.navy{background:var(--navy);color:#fff}.btn.soft{background:var(--ok-soft);color:var(--ok)}.btn.gray{background:var(--bg);color:var(--ink)}
.btn.link{background:none;color:var(--mute);font-weight:700;font-size:15px;min-height:42px;margin-top:4px}
.btn.sm{display:inline-flex;width:auto;min-height:36px;padding:0 12px;font-size:13px;border-radius:12px;margin:0}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn svg{width:20px;height:20px}
.ribbon{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:14px 16px;border-radius:20px;background:var(--navy);color:#fff;text-align:left;width:calc(100% - 32px)}
.ribbon .d{font-size:26px;white-space:nowrap}
.nequi{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:16px;padding:12px 14px;margin-top:12px}
.nequi .d{font-size:24px;letter-spacing:1px;white-space:nowrap}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .nm{flex:1;font-weight:700;line-height:1.25}.li .nm small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.tag{padding:4px 9px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.no{background:var(--bad-soft);color:var(--bad)}.tag.wait{background:var(--warn-soft);color:var(--warn)}.tag.inv{background:var(--bg);color:var(--mute)}
.grp{font-size:12px;font-weight:800;letter-spacing:1px;margin:14px 0 2px}
.proof{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.proof:first-of-type{border-top:0}
.proof img{width:56px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg);cursor:zoom-in}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:0 0 env(safe-area-inset-bottom);pointer-events:none}
.tabs .in{max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 6px 10px;pointer-events:auto}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;font-size:12px;font-weight:700;color:#8892A8}
.tabs button.on{color:var(--navy);font-weight:800}
.tabs svg{width:24px;height:24px}
/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{min-height:36px;padding:0 12px;border-radius:99px;border:1.5px solid rgba(255,255,255,.4);background:rgba(11,23,54,.35);color:#fff;font-weight:700;font-size:13px}
.chip.on{background:var(--sky);border-color:var(--sky);color:var(--navy)}
.opts{display:grid;gap:6px;margin-top:6px}
.opts button{min-height:44px;border-radius:12px;background:var(--bg);font-weight:700;font-size:14px}
.opts button.on{background:var(--navy);color:#fff}
/* stats */
.big{font-size:clamp(64px,20vw,84px);white-space:nowrap}
.series{display:flex;align-items:flex-end;gap:5px;height:100px;margin-top:12px}
.series div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;font-weight:800;color:var(--mute);height:100%}
.series i{display:block;width:100%;max-width:28px;border-radius:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mute);font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px}
.mini{height:6px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}.mini i{display:block;height:100%;background:var(--sky)}
.res{display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.res .vs .d{font-size:30px}
/* pitch */
.pitch{position:relative;margin:14px 16px 0;aspect-ratio:939/1400;border-radius:22px;overflow:hidden;background:var(--navy2);touch-action:none;user-select:none}
.pitch>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.pitch::after{content:"";position:absolute;inset:0;background:rgba(11,23,54,.15);pointer-events:none}
.tk{position:absolute;z-index:2;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;touch-action:none;cursor:grab}
.tk .c{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.45);overflow:hidden;border:2px solid}
.tk.N .c{background:#111;color:#fff;border-color:var(--sky)}.tk.B .c{background:#fff;color:var(--navy);border-color:#fff}
.tk .c img{width:100%;height:100%;object-fit:cover}
.tk span{font-size:11px;font-weight:800;color:#fff;background:rgba(11,23,54,.7);padding:1px 7px;border-radius:99px;white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.tk.drag{z-index:5}.tk.drag .c{transform:scale(1.15)}
.plabel{position:absolute;z-index:3;left:12px;font-size:12px;font-weight:800;letter-spacing:1px;padding:5px 10px;border-radius:99px}
.bench{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bench button{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--bg);font-weight:700;font-size:13px;min-height:38px}
/* sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(11,23,54,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:Anton,sans-serif;font-weight:400;font-size:30px;letter-spacing:.3px;line-height:1}
.step{display:flex;align-items:center;gap:8px;margin-top:18px;font-weight:800;font-size:15px}
.step i{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);margin-top:8px}
.pick.on{border-color:var(--sky);background:var(--sky-soft)}
.pick input{width:20px;height:20px;accent-color:var(--navy)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin-top:8px;min-height:90px;padding:14px;border-radius:16px;border:2px dashed var(--sky);background:var(--sky-soft);color:#2463B0;font-weight:800;text-align:center;cursor:pointer;width:100%}
.drop img{max-height:220px;border-radius:12px}
label.f{display:block;margin-top:14px;font-weight:700;font-size:14px}
input.i,select.i{width:100%;margin-top:6px;min-height:50px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
input.i:focus,select.i:focus{border-color:var(--sky);outline:0}
.goalbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.goalbtns button{min-height:62px;border-radius:16px;font-weight:800;font-size:16px}
.gN{background:#111;color:#fff}.gB{background:#fff;color:var(--navy);border:2px solid var(--navy)!important}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.pgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--bg);font-weight:700;font-size:13px;line-height:1.2}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:70;background:var(--navy);color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;animation:up .2s;max-width:90vw;text-align:center}
.lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:20px}.lb img{max-width:100%;max-height:90vh;border-radius:12px}
.empty{padding:18px;text-align:center;color:var(--mute)}
/* landing */
.land{min-height:100vh;display:flex;flex-direction:column;background:var(--navy)}
.land .hero{flex:1;min-height:52vh}
.land .hero::after{background:linear-gradient(180deg,rgba(11,23,54,.2) 0%,rgba(11,23,54,0) 35%,rgba(11,23,54,.55) 75%,var(--navy) 100%)}
.land .hero>.in{position:absolute;left:0;right:0;bottom:0}
.role{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.role .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800}
.role b{display:block;font-size:17px}.role span{display:block;font-size:14px;color:var(--mute)}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.who button{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;min-height:38px}
.back{display:flex;align-items:center;gap:6px;color:var(--sky);font-weight:800;min-height:44px}
.num{position:absolute;right:-6px;top:20px;font-family:Anton,sans-serif;font-size:220px;line-height:1;color:var(--sky);opacity:.22;z-index:1}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;margin-top:20px;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}
.pstats .d{font-size:28px}.pstats span{font-size:11px;font-weight:700;color:#C9D3E6}
@keyframes up{from{transform:translateY(24px);opacity:0}}@keyframes fd{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="layer"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="crest" viewBox="0 0 64 74"><path d="M32 2 L61 12 V36 C61 54 48 66 32 72 C16 66 3 54 3 36 V12 Z" fill="#fff"/><path d="M32 8 L55 16 V36 C55 51 44 61 32 66 C20 61 9 51 9 36 V16 Z" fill="#0B1736"/><path d="M9 30 H55 V40 H9 Z" fill="#4EA8FF"/><circle cx="32" cy="35" r="8" fill="#fff"/><path d="M32 30.5l3.6 2.7-1.4 4.1h-4.4l-1.4-4.1z" fill="#0B1736"/></symbol>
<symbol id="t-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></symbol>
<symbol id="t-cup" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
<symbol id="t-board" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4 12h16" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
<symbol id="t-me" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
</defs></svg>
<script>
{
const KEY='fuchibol_club_v2';
const CUPO={'5 vs 5':14,'7 vs 7':18};
const ROL={ARQ:'Arquero',DEF:'Defensa',MED:'Medio',DEL:'Delantero'};
const PIE=['Diestro','Zurdo','Ambidiestro'];
const TEAM={N:'Negro',B:'Blanco'};
const IMG={estadio:'img/estadio.jpg',esquina:'img/esquina.jpg',balon:'img/balon.jpg',guayos:'img/guayos.jpg',cancha:'img/cancha.jpg'};
const SLOTS=[[50,90],[26,78],[74,78],[50,72],[20,63],[80,63],[38,58],[62,58],[50,55]];
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=v=>typeof v==='string'&&/^data:image\//.test(v)?v:'';
const uid=()=>Math.random().toString(36).slice(2,10);
const cop=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const ini=n=>String(n||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const first=p=>p?(p.apodo||p.nombre.split(' ')[0]):'?';
const dt=(d,h)=>new Date(d+'T'+(h||'12:00'));
const fTime=h=>{if(!h)return'';const[H,M]=h.split(':').map(Number);return((H%12)||12)+':'+String(M).padStart(2,'0')+(H<12?' am':' pm')};
const fShort=d=>dt(d).toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'');
const fDM=d=>dt(d).toLocaleDateString('es-CO',{day:'numeric',month:'short'}).replace(/\./g,'').toUpperCase();
const addDays=(d,n)=>{const x=dt(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const cuotaCalc=(valor,n)=>Math.ceil((valor||0)/Math.max(1,n)/100)*100;
const HORAS=[['19:00','7 pm'],['20:00','8 pm']];
const slotXY=(t,i)=>{const[x,y]=SLOTS[i]||[50,60];return t==='B'?{x,y}:{x:100-x,y:100-y}};

/* ---------- sample data ---------- */
const SAMPLE='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160"><rect width="120" height="160" rx="10" fill="#EAF4FF"/><rect x="14" y="18" width="92" height="10" rx="3" fill="#C9DDF5"/><rect x="14" y="40" width="60" height="8" rx="3" fill="#DCE8F7"/><rect x="14" y="56" width="80" height="8" rx="3" fill="#DCE8F7"/><text x="60" y="108" fill="#2463B0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">EJEMPLO</text></svg>');
function autoBoard(m,players){
  const o={ARQ:0,DEF:1,MED:2,DEL:3};
  const ps=m.convocados.map(id=>players.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>o[a.rol]-o[b.rol]);
  const cnt={N:0,B:0};m.board={};
  ps.forEach((p,i)=>{let t=(i%4===0||i%4===3)?'N':'B';if(cnt[t]>cnt[t==='N'?'B':'N'])t=t==='N'?'B':'N';const k=cnt[t]++;m.board[p.id]=k<SLOTS.length?{team:t,...slotXY(t,k)}:{team:t,sub:true}});
}
function seed(){

/* ---------- utils ---------- */
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
async function shrink(file,max){const u=URL.createObjectURL(file),im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);return cv.toDataURL('image/jpeg',.8)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){toast(t)}}
function enterAs(id){S.ses={mode:'player',id};tab='inicio';page=null;draft=null;landStep=null;save();render();scrollTo(0,0)}
function login(e){e=String(e||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('Escribe un correo válido');return}
  let p=S.players.find(x=>x.email===e);
  if(!p){p={id:'p'+uid(),email:e,nombre:e.split('@')[0].replace(/[._-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),rol:'MED',pie:'Diestro',dorsal:'',apodo:'',foto:'',tel:'',admin:false};S.players.push(p);enterAs(p.id);tab='yo';render();toast('Bienvenido. Completa tu ficha.');return}
  enterAs(p.id)}
function syncDraft(){if(!draft)return;['nombre','apodo','dorsal','tel'].forEach(k=>{const el=$('#f-'+k);if(el)draft[k]=el.value})}
function placeIn(m,id,t){if(!t){const n=Object.values(m.board).filter(b=>b.team==='N').length,b=Object.values(m.board).filter(b=>b.team==='B').length;t=n<=b?'N':'B'}const used=Object.values(m.board).filter(b=>b.team===t&&!b.sub).length;m.board[id]=used<SLOTS.length?{team:t,...slotXY(t,used)}:{team:t,sub:true}}

function bindPitch(){const pitch=$('#pitch');if(!pitch)return;const adm=isAdmin();
  pitch.querySelectorAll('.tk').forEach(tk=>{let sx,sy,mv=false,down=false;
    tk.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;mv=false;down=true;if(adm){tk.setPointerCapture(e.pointerId);tk.classList.add('drag')}});
    tk.addEventListener('pointermove',e=>{if(!adm||!down)return;if(Math.hypot(e.clientX-sx,e.clientY-sy)>6)mv=true;if(!mv)return;const r=pitch.getBoundingClientRect();tk.style.left=Math.max(6,Math.min(94,(e.clientX-r.left)/r.width*100))+'%';tk.style.top=Math.max(5,Math.min(95,(e.clientY-r.top)/r.height*100))+'%'});
    tk.addEventListener('pointerup',()=>{down=false;tk.classList.remove('drag');const m=curM(),id=tk.dataset.id;
      if(mv&&adm){const b=m.board[id];b.x=parseFloat(tk.style.left);b.y=parseFloat(tk.style.top);const nt=b.y<50?'N':'B';if(nt!==b.team){b.team=nt;save();render()}else save()}else sheetTok(id)});
    tk.addEventListener('pointercancel',()=>{down=false;tk.classList.remove('drag')})})}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==='bg'&&e.target!==t)return;
  const M=()=>S.matches.find(x=>x.id===(t.dataset.m||curMatch));
  switch(a){
    case'tab':tab=t.dataset.v;page=null;draft=null;render();scrollTo(0,0);break;
    case'land':landStep=t.dataset.v||null;renderLanding();break;
    case'as':enterAs(id);break;
    case'visor':S.ses={mode:'visor'};tab='inicio';page=null;save();render();break;
    case'login':login($('#email').value);break;
    case'logout':S.ses=null;landStep=null;page=null;save();render();scrollTo(0,0);break;
    case'admin':page='admin';render();scrollTo(0,0);break;
    case'noadmin':page=null;render();break;
    case'pickm':curMatch=id;render();break;
    case'filt':filt=t.dataset.v;render();break;
    case'join':{const m=M(),y=me().id;if(m.estado!=='abierta'){toast('La convocatoria ya cerró');return}if(m.convocados.length<m.cupo&&!m.convocados.includes(y)){m.convocados.push(y);placeIn(m,y);save();render();toast('Listo, quedaste convocado')}break}
    case'leave':{const m=M(),y=me().id;if(m.estado!=='abierta'){toast('Ya cerró: igual debes pagar');return}m.convocados=m.convocados.filter(x=>x!==y);delete m.board[y];save();render();break}
    case'pay':if(curM()?.estado==='abierta'){toast('Se paga cuando cierre la convocatoria');return}pd={mid:curMatch,cubre:new Set([me().id]),proof:''};drawPay();break;
    case'cover':t.checked?pd.cubre.add(id):pd.cubre.delete(id);drawPay();break;
    case'proof':$('#proofIn').click();break;
    case'photo':$('#photoIn').click();break;
    case'sendpay':{if(!pd.proof)return;const m=S.matches.find(x=>x.id===pd.mid);S.pays.push({id:uid(),matchId:m.id,payerId:me().id,cubre:[...pd.cubre],monto:cuota(m)*pd.cubre.size,proof:pd.proof,ts:Date.now(),estado:isAdmin()?'verificado':'reportado'});save();close();render();toast('Pago enviado. Ya todos lo ven.');break}
    case'verify':case'reject':{const p=S.pays.find(x=>x.id===id);p.estado=a==='verify'?'verificado':'rechazado';save();render();break}
    case'zoom':$('#layer').innerHTML=`<div class="lb" data-act="bg"><img src="${img(t.getAttribute('src'))}" alt="Comprobante"></div>`;break;
    case'bg':close();break;
    case'copy':copy(t.dataset.t);break;
    case'copyfaltan':{const m=M(),pm=payMap(m),c=cancha(m);const f=m.convocados.filter(x=>!pm[x]).map(x=>'- '+pl(x).nombre);copy(`Fuchibol ${fShort(m.fecha)} ${fTime(m.hora)} · ${c.nombre}\nCuota ${cop(cuota(m))} por Nequi ${c.nequi}\nFaltan por pagar (${f.length}):\n${f.join('\n')}`);break}
    case'guest':sheet(`<h2>AGREGAR INVITADO</h2><p class="muted s" style="margin:4px 0 0">No tiene cuenta. Ocupa un cupo y paga la cuota fija.</p><label class="f">Nombre<input class="i" id="g-n" placeholder="Ej. Primo de Andrés"></label><label class="f">¿Dónde juega?</label><div class="opts" id="g-r" style="grid-template-columns:repeat(4,minmax(0,1fr))">${Object.entries(ROL).map(([k,l],i)=>`<button class="${i===2?'on':''}" data-act="opt" data-v="${k}">${l}</button>`).join('')}</div><button class="btn navy" data-act="addguest">Agregar</button>`);break;
    case'opt':case'fmt':t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));break;
    case'addguest':{const n=$('#g-n').value.trim();if(!n){toast('Escribe el nombre');return}const m=M();if(m.estado!=='abierta'){toast('Solo con la convocatoria abierta');return}if(m.convocados.length>=m.cupo){toast('No quedan cupos');return}
      const g={id:'g'+uid(),nombre:n,rol:$('#g-r .on')?.dataset.v||'MED',pie:'Diestro',dorsal:'',invitado:true,invitadoPor:me().id,email:'',foto:'',apodo:''};S.players.push(g);m.convocados.push(g.id);placeIn(m,g.id);save();close();render();toast(n+' agregado');break}
    case'set':syncDraft();draft[t.dataset.k]=t.dataset.v;render();break;
    case'saveyo':{syncDraft();const i=S.players.findIndex(p=>p.id===me().id);S.players[i]={...S.players[i],...draft};save();render();toast('Ficha guardada');break}
    case'tok':sheetTok(id);break;
    case'toteam':{const m=curM();placeIn(m,id,t.dataset.v);save();close();render();break}
    case'tosub':{const m=curM();m.board[id]={team:m.board[id].team,sub:true};save();close();render();break}
    case'tobench':{const m=curM();delete m.board[id];save();close();render();break}
    case'auto':{const m=curM();autoBoard(m,S.players);save();render();toast('Equipos armados por posición');break}
    case'score':goalTeam=null;drawScore(id);break;
    case'gteam':goalTeam=t.dataset.v;drawScore(t.dataset.m);break;
    case'gback':goalTeam=null;drawScore(t.dataset.m);break;
    case'goal':{const m=M();m.goals.push({id:uid(),playerId:t.dataset.p,team:goalTeam});goalTeam=null;save();drawScore(m.id);render();toast('Gol anotado');break}
    case'ungoal':{const m=M();m.goals.splice(Number(t.dataset.i),1);save();drawScore(m.id);render();break}
    case'finish':case'reopen':{const m=M();m.estado=a==='finish'?'finalizado':'cerrada';save();close();render();toast(a==='finish'?'Partido terminado':'Partido reabierto');break}
    case'cancha':sheetCancha(id);break;
    case'savecancha':{const g=k=>$('#c-'+k).value.trim();if(!g('nombre')||!g('nequi')||!Number(g('valor'))){toast('Nombre, valor y Nequi son obligatorios');return}
      const c={id:id||'c'+uid(),nombre:g('nombre'),direccion:g('direccion'),formato:$('#c-fmt .on')?.dataset.v||'7 vs 7',valor:Number(g('valor')),nequi:g('nequi').replace(/\D/g,''),titular:g('titular'),notas:g('notas')};
      const i=S.canchas.findIndex(x=>x.id===c.id);i>=0?S.canchas[i]=c:S.canchas.push(c);save();close();render();toast('Cancha guardada');break}
    case'newm':{if(!S.canchas.length){toast('Primero crea una cancha');return}const d=addDays(new Date().toISOString().slice(0,10),7);
      sheet(`<h2>LANZAR CONVOCATORIA</h2><p class="muted s" style="margin:4px 0 0">La gente confirma con "Yo voy" hasta un día antes. Ahí se cierra y se calcula la cuota.</p>
      <label class="f">Cancha</label><div class="opts" id="n-c">${S.canchas.map((c,i)=>`<button class="${i===0?'on':''}" data-act="opt" data-v="${c.id}" style="text-align:left;padding:10px 14px;min-height:56px">${esc(c.nombre)}<span class="xs" style="display:block;font-weight:500;opacity:.8">${esc(c.formato)} · hasta ${CUPO[c.formato]} · ${cop(c.valor)}</span></button>`).join('')}</div>
      <label class="f">Fecha<input class="i" id="n-f" type="date" value="${d}"></label>
      <label class="f">Hora</label><div class="opts" id="n-h" style="grid-template-columns:1fr 1fr">${HORAS.map(([v,l],i)=>`<button class="${i===1?'on':''}" data-act="opt" data-v="${v}">${l}</button>`).join('')}</div>
      <button class="btn navy" data-act="createm">Publicar convocatoria</button>`);break}
    case'createm':{const c=S.canchas.find(x=>x.id===$('#n-c .on')?.dataset.v);const f=$('#n-f').value;if(!c||!f){toast('Elige cancha y fecha');return}
      const m={id:'m'+uid(),fecha:f,hora:$('#n-h .on')?.dataset.v||'20:00',canchaId:c.id,cupo:CUPO[c.formato],cuota:0,convocados:[],estado:'abierta',goals:[],board:{}};
      if(cierreDe(m)<=new Date()){toast('La fecha debe ser al menos en 2 días');return}
      S.matches.push(m);curMatch=m.id;save();page=null;tab='inicio';render();
      sheet(`<h2>CONVOCATORIA PUBLICADA</h2><p class="muted s" style="margin:4px 0 0">Mándala al grupo de WhatsApp para que la gente entre y confirme.</p><div style="white-space:pre-line;background:var(--bg);border-radius:14px;padding:14px;margin-top:12px;font-size:14px">${esc(shareText(m))}</div><button class="btn navy" data-act="copy" data-t="${esc(shareText(m))}">Copiar mensaje</button><button class="btn link" data-act="bg">Listo</button>`);break}
    case'share':{const m=M()||S.matches.find(x=>x.id===id);copy(shareText(S.matches.find(x=>x.id===id)));break}
    case'closeconv':{const m=S.matches.find(x=>x.id===id);sheet(`<h2>CERRAR CONVOCATORIA</h2><p class="muted s" style="margin:6px 0 0">Van ${m.convocados.length}. La cuota queda en <b>${cop(cuotaCalc(cancha(m).valor,m.convocados.length))}</b> (${cop(cancha(m).valor)} ÷ ${m.convocados.length}). Nadie más podrá entrar ni bajarse.</p><button class="btn navy" data-act="closeok" data-id="${m.id}">Cerrar y fijar cuota</button><button class="btn link" data-act="bg">Cancelar</button>`);break}
    case'closeok':{const m=S.matches.find(x=>x.id===id);closeConv(m);save();close();render();toast('Convocatoria cerrada. Ya pueden pagar.');break}
    case'newt':sheet(`<h2>NUEVO TORNEO</h2><p class="muted s" style="margin:4px 0 0">Cuenta partidos ganados por Negro y Blanco.</p><label class="f">Nombre<input class="i" id="t-n" placeholder="Ej. Torneo de diciembre"></label><label class="f">Empieza<input class="i" id="t-i" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="f">Semanas<input class="i" id="t-s" type="number" inputmode="numeric" value="6" min="1" max="52"></label><button class="btn navy" data-act="savet">Crear torneo</button>`);break;
    case'savet':{const n=$('#t-n').value.trim()||'Torneo';const i=$('#t-i').value;const w=Number($('#t-s').value)||6;if(!i){toast('Elige la fecha');return}S.torneos.push({id:'t'+uid(),nombre:n,inicio:i,semanas:w});filt='tor';save();close();render();toast('Torneo creado');break}
    case'tadmin':{const p=pl(id);p.admin=!p.admin;save();render();break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.id==='email')login(e.target.value)});
document.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Sube una imagen');return}
  try{if(e.target.id==='proofIn'){pd.proof=await shrink(f,900);drawPay()}if(e.target.id==='photoIn'){syncDraft();draft.foto=await shrink(f,360);const i=S.players.findIndex(p=>p.id===me().id);S.players[i].foto=draft.foto;save();render()}}catch(err){toast('No se pudo leer la imagen')}});
render();
}
</script>
</body>
</html>
