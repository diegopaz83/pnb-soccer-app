<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuchibol</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060D1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuchibol">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a club's matchday app: proud, plain, one thumb
   IDEA: football club website (match centre, standings, player page) for a weekly pickup group
   PICTURE: night-pitch photography heroes under a navy veil; real pitch as the board
   COLOUR/TYPE: navy #0B1736, sky #4EA8FF, white cards on cool grey; Anton display + Inter
   LAYOUT: 480px phone column, photo hero per tab, overlapping cards, bottom tabs, sheets */
:root{color-scheme:dark;--navy:#0B1736;--navy2:#13234A;--neon:#3DE0FF;--sky:#3DE0FF;--sky-soft:rgba(61,224,255,.14);--bg:rgba(255,255,255,.05);--page:#060D1E;--ink:#F2F6FF;--mute:#93A4C8;--line:rgba(255,255,255,.1);--glass:rgba(16,30,64,.62);--ok:#3DE0FF;--ok-soft:rgba(61,224,255,.14);--bad:#FFB547;--bad-soft:rgba(255,181,71,.15);--warn:#C9D6F2;--warn-soft:rgba(255,255,255,.1)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#03070F;color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{margin:0}
.d{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.3px;line-height:1}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:110px;position:relative}
/* hero */
.hero{position:relative;color:#fff;overflow:hidden;background:var(--navy)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,23,54,.35) 0%,rgba(11,23,54,.1) 30%,rgba(11,23,54,.45) 65%,rgba(11,23,54,.94) 100%)}
.hero>.in{position:relative;z-index:1;padding:14px 18px 22px}
.top{display:flex;align-items:center;gap:10px}
.top .sp{flex:1}
.brand{font-size:22px}
.kick{font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--sky);text-transform:uppercase}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px;background:#E8EDF6;color:var(--navy);overflow:hidden}
.av.sky{background:var(--sky);color:var(--navy)}
.av.lg{width:96px;height:96px;border-radius:24px;font-size:36px;font-family:Anton,sans-serif;font-weight:400;background:var(--navy2);color:#fff;border:2px solid var(--sky)}
.av.sm{width:28px;height:28px;font-size:10px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;text-align:center;gap:6px}
.kit{width:52px;height:52px;margin:0 auto;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.kit.N{background:#111}.kit.B{background:#fff;border-color:var(--sky)}
.tname{font-size:22px;margin-top:8px}
.ghostbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1.5px solid rgba(255,255,255,.45);background:rgba(11,23,54,.35);backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:700}
/* cards */
.card{background:#fff;border-radius:20px;padding:16px;margin:14px 16px 0;box-shadow:0 1px 2px rgba(11,23,54,.05)}
.card.lift{margin-top:-22px;position:relative;z-index:2;box-shadow:0 8px 24px rgba(11,23,54,.12)}
.card h3{font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-size:13px;font-weight:600;color:var(--mute)}
.muted{color:var(--mute)}.s{font-size:14px}.xs{font-size:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:99px;background:var(--navy);transition:width .5s}
.bar.g i{background:#3DE0FF}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;background:var(--sky);color:var(--navy);font-weight:800;font-size:17px;margin-top:14px}
.btn:disabled{opacity:.45}
.btn.navy{background:var(--navy);color:#fff}.btn.soft{background:var(--ok-soft);color:var(--ok)}.btn.gray{background:var(--bg);color:var(--ink)}
.btn.link{background:none;color:var(--mute);font-weight:700;font-size:15px;min-height:42px;margin-top:4px}
.btn.sm{display:inline-flex;width:auto;min-height:36px;padding:0 12px;font-size:13px;border-radius:12px;margin:0}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn svg{width:20px;height:20px}
.ribbon{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:14px 16px;border-radius:20px;background:var(--navy);color:#fff;text-align:left;width:calc(100% - 32px)}
.ribbon .d{font-size:26px;white-space:nowrap}
.nequi{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:16px;padding:12px 14px;margin-top:12px}
.nequi .d{font-size:24px;letter-spacing:1px;white-space:nowrap}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .nm{flex:1;font-weight:700;line-height:1.25}.li .nm small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.tag{padding:4px 9px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.no{background:var(--bad-soft);color:var(--bad)}.tag.wait{background:var(--warn-soft);color:var(--warn)}.tag.inv{background:var(--bg);color:var(--mute)}
.grp{font-size:12px;font-weight:800;letter-spacing:1px;margin:14px 0 2px}
.proof{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.proof:first-of-type{border-top:0}
.proof img{width:56px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg);cursor:zoom-in}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:0 0 env(safe-area-inset-bottom);pointer-events:none}
.tabs .in{max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--nt,4),minmax(0,1fr));padding:6px 6px 10px;pointer-events:auto}
.tabs button.adm{color:#2463B0}.tabs button.adm.on{color:var(--navy)}
.admbadge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;background:var(--sky);color:var(--navy);font-size:10.5px;font-weight:800;letter-spacing:.6px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;font-size:12px;font-weight:700;color:#8892A8}
.tabs button.on{color:var(--navy);font-weight:800}
.tabs svg{width:24px;height:24px}
/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{min-height:36px;padding:0 12px;border-radius:99px;border:1.5px solid rgba(255,255,255,.4);background:rgba(11,23,54,.35);color:#fff;font-weight:700;font-size:13px}
.chip.on{background:var(--sky);border-color:var(--sky);color:var(--navy)}
.opts{display:grid;gap:6px;margin-top:6px}
.opts button{min-height:44px;border-radius:12px;background:var(--bg);font-weight:700;font-size:14px}
.opts button.on{background:var(--navy);color:#fff}
/* stats */
.big{font-size:clamp(64px,20vw,84px);white-space:nowrap}
.series{display:flex;align-items:flex-end;gap:5px;height:100px;margin-top:12px}
.series div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;font-weight:800;color:var(--mute);height:100%}
.series i{display:block;width:100%;max-width:28px;border-radius:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mute);font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px}
.mini{height:6px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}.mini i{display:block;height:100%;background:var(--sky)}
.res{display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.res .vs .d{font-size:30px}
/* pitch */
.pitch{position:relative;margin:14px 16px 0;aspect-ratio:939/1400;border-radius:22px;overflow:hidden;background:var(--navy2);touch-action:pan-y;user-select:none}
.pitch>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.pitch.old>img{filter:grayscale(1) brightness(.85)}.pitch.old .tk .c{filter:grayscale(.6)}
.goalb{position:absolute;z-index:5;top:-7px;left:calc(50% + 9px);width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}.goalb svg{display:block}.goalb i{position:absolute;left:19px;bottom:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#3DE0FF;color:#04121F;font:900 10px/16px Inter,system-ui,sans-serif;font-style:normal;text-align:center;border:2px solid #0A142E}.tk.bn .goalb{width:18px;height:18px;left:calc(50% + 4px);top:-6px}.tk.bn .goalb i{left:15px}
.pitch::after{content:"";position:absolute;inset:0;background:rgba(11,23,54,.15);pointer-events:none}
.tk{position:absolute;margin:-21px 0 0 -38px;display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;touch-action:manipulation;cursor:pointer}
.pitch.edit .tk{touch-action:none;cursor:grab}
.tk.bn{width:58px;margin:-15px 0 0 -29px}.tk.bn .c{width:30px;height:30px;font-size:11px;border-width:2px;opacity:.9}.tk.bn span{font-size:10px;max-width:58px}
.tk.me .c{border-style:dashed!important;border-color:#93A4C8!important;opacity:.55;filter:grayscale(1)}.tk.me span{background:rgba(147,164,200,.35)}
.blabel{position:absolute;z-index:3;right:8px;font-size:10px;font-weight:800;letter-spacing:1px;color:#C9D6F2;background:rgba(6,13,30,.7);padding:3px 7px;border-radius:99px}
.car button.picked{animation:pick .42s ease-out;border-color:currentColor}
@keyframes pick{0%{transform:scale(1)}35%{transform:scale(1.12)}70%{transform:scale(.96)}100%{transform:scale(1.04)}}
.car.good button.picked{box-shadow:0 0 0 3px rgba(61,224,255,.35),0 0 24px rgba(61,224,255,.5)}.car.bad button.picked{box-shadow:0 0 0 3px rgba(255,181,71,.35),0 0 24px rgba(255,181,71,.5)}
.rt.pop{animation:pop .5s ease-out}@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
.tk .c{position:relative;z-index:2;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.45);overflow:hidden;border:2px solid}
.tk.N .c{background:#111;color:#fff;border-color:var(--sky)}.tk.B .c{background:#fff;color:var(--navy);border-color:#fff}
.tk .c img{width:100%;height:100%;object-fit:cover}
.tk span{position:relative;z-index:4;font-size:11px;font-weight:800;color:#fff;background:rgba(11,23,54,.7);padding:1px 7px;border-radius:99px;white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.tk em.rt{position:relative;z-index:4;white-space:nowrap;font-style:normal;font-size:10px;font-weight:800;color:#F2C94C;background:rgba(11,23,54,.8);padding:0 6px;border-radius:99px;margin-top:-1px}
.tk.drag .c{transform:scale(1.15);z-index:6}
.plabel{position:absolute;z-index:3;left:12px;font-size:12px;font-weight:800;letter-spacing:1px;padding:5px 10px;border-radius:99px}
.bench{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bench button{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--bg);font-weight:700;font-size:13px;min-height:38px}
/* sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(11,23,54,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:Anton,sans-serif;font-weight:400;font-size:30px;letter-spacing:.3px;line-height:1}
.step{display:flex;align-items:center;gap:8px;margin-top:18px;font-weight:800;font-size:15px}
.step i{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);margin-top:8px}
.pick.on{border-color:var(--sky);background:var(--sky-soft)}
.pick input{width:20px;height:20px;accent-color:var(--navy)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin-top:8px;min-height:90px;padding:14px;border-radius:16px;border:2px dashed var(--sky);background:var(--sky-soft);color:#2463B0;font-weight:800;text-align:center;cursor:pointer;width:100%}
.drop img{max-height:220px;border-radius:12px}
label.f{display:block;margin-top:14px;font-weight:700;font-size:14px}
input.i,select.i{width:100%;margin-top:6px;min-height:50px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
input.i:focus,select.i:focus{border-color:var(--sky);outline:0}
.goalbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.goalbtns button{min-height:62px;border-radius:16px;font-weight:800;font-size:16px}
.gN{background:#111;color:#fff}.gB{background:#fff;color:var(--navy);border:2px solid var(--navy)!important}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:6px -20px 0;padding-inline:20px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.car button{flex:0 0 96px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:18px;background:var(--bg);border:2px solid transparent;text-align:center}
.car button .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center}
.car.good .ic{background:var(--ok-soft);color:var(--ok)}.car.bad .ic{background:var(--bad-soft);color:var(--bad)}
.car button b{font-size:14px;line-height:1.1}.car button small{font-size:11px;color:var(--mute);line-height:1.2}
.car.good button.on{border-color:var(--ok);background:#fff}.car.bad button.on{border-color:var(--bad);background:#fff}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.pgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--bg);font-weight:700;font-size:13px;line-height:1.2}
.debt{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:var(--sky);color:var(--navy);font-size:13px;font-weight:800;white-space:nowrap}
.debt i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.tabs button{position:relative}
.seg{display:flex;background:#E4E9F2;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:30px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(11,23,54,.12)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:70;background:var(--navy);color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;animation:up .2s;max-width:90vw;text-align:center}
.gal{position:fixed;inset:0;z-index:80;background:#06101F;color:#fff;display:flex;flex-direction:column;animation:fd .2s}
.gal .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;max-width:480px;width:100%;margin:0 auto}
.gal .sum{max-width:480px;width:calc(100% - 32px);margin:0 auto;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px}
.gal .tr{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;max-width:480px;width:100%;margin:10px auto 0}
.gal .tr::-webkit-scrollbar{display:none}
.gal .sl{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;padding:0 16px;min-height:0}
.gal .sl img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:14px;background:#0F1B33}
.gal .ft{display:flex;align-items:center;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));max-width:480px;width:100%;margin:0 auto}
.gal .nav{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;font-weight:800}
.lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:20px}.lb img{max-width:100%;max-height:90vh;border-radius:12px}
.empty{padding:18px;text-align:center;color:var(--mute)}
/* landing */
.land{min-height:100vh;display:flex;flex-direction:column;background:var(--navy)}
.land .hero{flex:1;min-height:52vh}
.land .hero::after{background:linear-gradient(180deg,rgba(11,23,54,.2) 0%,rgba(11,23,54,0) 35%,rgba(11,23,54,.55) 75%,var(--navy) 100%)}
.land .hero>.in{position:absolute;left:0;right:0;bottom:0}
.role{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.role .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800}
.role b{display:block;font-size:17px}.role span{display:block;font-size:14px;color:var(--mute)}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.who button{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;min-height:38px}
.back{display:flex;align-items:center;gap:6px;color:var(--sky);font-weight:800;min-height:44px}
.num{position:absolute;right:-6px;top:20px;font-family:Anton,sans-serif;font-size:220px;line-height:1;color:var(--sky);opacity:.22;z-index:1}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;margin-top:20px;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}
.pstats .d{font-size:28px}.pstats span{font-size:11px;font-weight:700;color:#C9D3E6}
@keyframes up{from{transform:translateY(24px);opacity:0}}@keyframes fd{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== theme: azul noche + vidrio + neón ===== */
.app{background:var(--page)}
.app::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url(img/cancha.jpg) center/cover;filter:grayscale(1) brightness(.35);opacity:.55}
.app::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,13,30,.55),rgba(6,13,30,.92) 70%),#0B2A6B;mix-blend-mode:multiply}
.app>*{position:relative;z-index:1}
.hero{background:var(--page)}
.hero>img{filter:grayscale(1) contrast(1.15) brightness(.85)}
.hero::before{content:"";position:absolute;inset:0;background:#1846B8;mix-blend-mode:color;opacity:.85;z-index:0}
.hero::after{z-index:0;background:linear-gradient(180deg,rgba(6,13,30,.45) 0%,rgba(6,13,30,.05) 32%,rgba(6,13,30,.5) 68%,var(--page) 100%)}

function filters(){const t=activeT();const F=[];if(t)F.push(['tor',t.nombre]);F.push(['mes','Último mes'],['seis','Últimos 6'],['tri','Trimestre'],['todo','Todo']);return F}
function filtered(k){const f=finished();const today=new Date().toISOString().slice(0,10);
  if(k==='tor'){const t=activeT();return{ms:f.filter(m=>m.fecha>=t.inicio&&m.fecha<=t.fin),title:`${t.nombre} · ${fDM(t.inicio)} – ${fDM(t.fin)}`.toUpperCase()}}

  if(k==='seis')return{ms:f.slice(0,6),title:'ÚLTIMOS 6 PARTIDOS'};

function vTorneo(){
  const F=filters();if(!filt||!F.some(x=>x[0]===filt))filt=F[0][0];

  const top=Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,5),tg=top[0]?.[1]||1;
  const lead=tt.N>tt.B?'Negro manda':tt.B>tt.N?'Blanco manda':'Parejos';
  const t=activeT(),isT=filt==='tor';
  return `<section class="hero"><img src="${IMG.balon}" alt="" style="object-position:80% 45%"><div class="in">${topbar()}

    <p style="text-align:center;margin:6px 0 0;color:#DCE3F2;font-size:14px">${ms.length} partidos · ${lead} · ${tt.E} empates${isT?` · faltan ${Math.max(0,t.semanas-ms.length)} fechas`:''}</p></div></section>
  <section class="card"><h3>Partido a partido</h3>${chron.length?`<div class="series">${chron.map(m=>{const s=score(m);const h=Math.round((s.N+s.B)/max*72)+8;const bg=s.N>s.B?'#111':s.B>s.N?'#fff':'#C3CBDA';return`<div>${s.N}-${s.B}<i style="height:${h}px;background:${bg};border:1.5px solid ${s.B>s.N?'#0B1736':bg}"></i></div>`}).join('')}</div>
    <div class="legend"><span><i style="background:#111"></i>Ganó Negro</span><span><i style="background:#fff;border:1.5px solid #0B1736"></i>Ganó Blanco</span><span><i style="background:#C3CBDA"></i>Empate</span></div>`:'<div class="empty">Sin partidos en este periodo.</div>'}</section>
  <section class="card"><h3>Goleadores <small>${Object.values(gc).reduce((a,b)=>a+b,0)} goles</small></h3>${top.map(([id,g],i)=>{const p=pl(id);return`<div class="li"><b style="width:18px;text-align:center;color:var(--mute)">${i+1}</b>${av(p)}<div class="nm">${esc(p?.nombre||'?')}<div class="mini"><i style="width:${Math.round(g/tg*100)}%"></i></div></div><span class="d" style="font-size:26px">${g}</span></div>`}).join('')||'<div class="empty">Sin goles.</div>'}</section>
  <section class="card"><h3>Resultados</h3>${ms.map(m=>{const s=score(m);return`<button class="res" data-act="score" data-id="${m.id}"><div class="muted xs" style="text-align:center;font-weight:700">${esc(fShort(m.fecha))} · ${esc(cancha(m).nombre)}</div><div class="vs" style="margin-top:4px"><b>Negro</b><span class="d">${s.N} – ${s.B}</span><b>Blanco</b></div></button>`}).join('')||'<div class="empty">—</div>'}</section>
  ${isAdmin()?`<div style="padding:0 16px"><button class="btn navy" data-act="newt">Nuevo torneo</button></div>`:''}`;

let boardM=null,boardMode='act',lastPop=null;
function vPizarra(){
  const fin_=finished(),act=inicioList(),hist=fin_.slice(1);
  const opts=[...act,...hist];
  const m=opts.find(x=>x.id===boardM)||upcoming().find(x=>x.estado==='cerrada')||finished()[0]||opts[0];
  const hero=`<section class="hero" style="min-height:230px"><img src="${IMG.guayos}" alt="" style="object-position:30% 45%"><div class="in">${topbar()}<h1 class="d" style="font-size:36px;margin-top:90px">ALINEACIÓN</h1><p style="margin:4px 0 0;color:#DCE3F2;font-size:14px">${m?esc(fShort(m.fecha))+' · '+esc(cancha(m).formato)+(m.estado==='finalizado'?' · así quedó':isAdmin()?' · arrastra o toca para acomodar':''):'Sin partidos'}</p>${m&&m.estado==='finalizado'?(()=>{const z=score(m);return`<p style="margin:6px 0 0;font-size:14px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:50%;background:#111;border:1.5px solid #fff"></span>Negro <span class="d" style="font-size:22px">${z.N} – ${z.B}</span> Blanco<span style="width:12px;height:12px;border-radius:50%;background:#fff"></span></p>`})():''}</div></section>`;
  if(!m)return hero;
  boardM=m.id;
  const b=m.board||{},inM=id=>m.convocados.includes(id);
  const on=Object.entries(b).filter(([id,v])=>v.x!=null&&inM(id));
  const bench=t=>Object.entries(b).filter(([id,v])=>v.x==null&&v.team===t&&inM(id)).map(([id])=>id);
  const cnt=t=>Object.entries(b).filter(([id,v])=>v.team===t&&inM(id)).length;
  const gcount=id=>m.goals.filter(g=>g.playerId===id).length;
  const s=score(m),fin=m.estado==='finalizado',rc=id=>fin?received(m,id):{good:{},bad:{}};
  if(hist.some(x=>x.id===m.id))boardMode='hist';else if(act.some(x=>x.id===m.id)&&boardMode!=='hist')boardMode='act';
  const shown=boardMode==='hist'?hist:act;
  const chipLab=x=>{const sx=score(x);return x.estado==='finalizado'?`${sx.N}-${sx.B}`:x.estado==='abierta'?'Abierta':'Por jugar'};
  const dShort=d=>dt(d).toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'').replace(/ de /g,' ');
  const chips=`<div class="seg" style="margin:14px 16px 0">${[['act','Actualidad'],['hist','Histórico']].map(([k,l])=>`<button class="${boardMode===k?'on':''}" data-act="bmode" data-v="${k}">${l}${k==='hist'?` · ${hist.length}`:''}</button>`).join('')}</div>
    <div id="bchips" style="${boardMode==='act'?`display:grid;grid-template-columns:repeat(${Math.max(1,shown.length)},minmax(0,1fr))`:'display:flex;overflow-x:auto'};gap:6px;scrollbar-width:none;padding:10px 16px 0">${shown.map(x=>`<button class="btn sm ${x.id===m.id?'navy':'gray'}" style="${boardMode==='act'?'width:100%;':'flex:none;'}flex-direction:column;gap:0;min-height:46px;line-height:1.15;padding:0 14px" data-act="pickb" data-id="${x.id}"><span>${esc(dShort(x.fecha))}</span><span class="xs" style="font-weight:600;opacity:.8">${chipLab(x)}</span></button>`).join('')||'<span class="muted s">Sin partidos anteriores</span>'}</div>`;
  const row=(t)=>{const ids=bench(t);return`<section class="card"><h3>Cambio ${TEAM[t]} <small>${ids.length}</small></h3>${ids.length?`<div class="bench">${ids.map(id=>`<button data-act="tok" data-id="${id}">${av(pl(id),'sm')}${esc(first(pl(id)))}${gcount(id)?` · <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-1px"><circle cx="12" cy="12" r="10" fill="#fff" stroke="#0B1736" stroke-width="2"/><path d="M12 7.5l4 2.9-1.5 4.7h-5L8 10.4z" fill="#0B1736"/></svg>${gcount(id)>1?gcount(id):''}`:''}</button>`).join('')}</div>`:'<p class="muted s" style="margin:6px 0 0">Nadie en el cambio.</p>'}</section>`};
  const old=fin&&!postOpen(m);
  return hero+chips+(fin?awards(m):'')+`<div class="pitch${old?' old':''}${isAdmin()&&!fin?' edit':''}" id="pitch"><img src="${IMG.cancha}" alt="Cancha">
    <span class="plabel" style="top:12px;background:#111;color:#fff">NEGRO · ${cnt('N')} JUG.</span>${bench('N').length?'<span class="blabel" style="top:12px">CAMBIO</span>':''}${bench('B').length?'<span class="blabel" style="bottom:12px">CAMBIO</span>':''}<span class="plabel" style="bottom:12px;background:#fff;color:var(--navy)">BLANCO · ${cnt('B')} JUG.</span>
    ${[...on,...['N','B'].flatMap(t=>bench(t).map((id,k)=>[id,{team:t,bn:1,x:89,y:t==='N'?13+k*8.5:86-k*8.5}]))].map(([id,v])=>{const p=pl(id);if(!p)return'';const f=img(p.foto),g=gcount(id);return`<div class="tk ${v.team}${v.bn?' bn':''}${postOpen(m)&&me()&&me().id===id?' me':''}${postOpen(m)&&me()&&ratedBy(m,me().id).includes(id)?' rated':''}" data-id="${id}" style="left:${v.x}%;top:${v.y}%"><div class="c">${f?`<img src="${f}" alt="">`:esc(p.dorsal||ini(p.nombre))}</div>${g?`<b class="goalb">${BALL}${g>1?`<i>${g}</i>`:''}</b>`:''}<span>${esc(first(p))}</span>${(()=>{const r=rc(id),g=topTag(r.good),b2=topTag(r.bad);return (g?`<em class="rt${lastPop===id+'good'?' pop':''}" style="background:#3DE0FF;color:#04121F;display:flex;align-items:center;gap:3px">${ticon(g[0],11)}${esc(g[0])}</em>`:'')+(b2?`<em class="rt${lastPop===id+'bad'?' pop':''}" style="background:#FFB547;color:#1F1405;display:flex;align-items:center;gap:3px">${ticon(b2[0],11)}${esc(b2[0])}</em>`:'')})()}</div>`}).join('')}</div>
  <p class="muted xs" style="margin:8px 16px 0">${fin?(postOpen(m)?'Postpartido: toca a un jugador (también los del cambio) para darle una buena o una mala. Máximo una de cada una.':'Así quedó el partido.'):'Los que no están en la cancha son el cambio de su equipo.'}</p>

async function shrink(file,max){const u=URL.createObjectURL(file),im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);return cv.toDataURL('image/jpeg',.8)}

function placeIn(m,id,t){const used=new Set(Object.entries(m.board).filter(([k,b])=>k!==id&&b.team===t&&b.x!=null).map(([k,b])=>Math.round(b.x)+','+Math.round(b.y)));
  const sl=slotsFor(m);for(let i=0;i<sl.length;i++){const xy=slotXY(m,t,i);if(!used.has(Math.round(xy.x)+','+Math.round(xy.y))){m.board[id]={team:t,...xy};return true}}
  const onTeam=Object.entries(m.board).filter(([k,b])=>k!==id&&b.team===t&&b.x!=null).length;if(onTeam<sl.length){m.board[id]={team:t,...slotXY(m,t,onTeam)};return true}

    case'callteam':callTeam=t.dataset.v;showCall();break;
    case'demofill':{const m=S.matches.find(x=>x.id===id),keep=['p2','p6','p10'],pool=S.players.filter(p=>!p.invitado&&!m.convocados.includes(p.id)&&!keep.includes(p.id)&&p.id!==me().id);
      while(m.convocados.length<m.cupo&&pool.length){const p=pool.shift();m.convocados.push(p.id);m.board[p.id]={team:p.equipo||'N'};m.nov=(m.nov||[]).filter(x=>x!==p.id)}save();render();toast(m.convocados.length>=m.cupo?'Convocatoria completa':'No hay más jugadores de prueba');break}
    case'subiok':{const m=S.matches.find(x=>x.id===t.dataset.m);delete m.subio[me().id];save();render();break}
    case'callsi':{const m=S.matches.find(x=>x.id===t.dataset.m),y=me().id;if(m.convocados.length>=m.cupo){toEsp(m,y,callTeam||'N');callTeam=null;save();render();toast('Quedaste de '+(inEsp(m,y)+1)+' en la lista de espera');return}m.nov=(m.nov||[]).filter(x=>x!==y);if(!m.convocados.includes(y))m.convocados.push(y);m.board[y]={team:callTeam||'N'};callTeam=null;save();render();toast('¡Listo! Vas con '+TEAM[m.board[y].team]);break}
    case'callno':{const m=S.matches.find(x=>x.id===t.dataset.m),y=me().id;m.nov=[...new Set([...(m.nov||[]),y])];callTeam=null;save();render();toast('Anotado: no vas. Si cambias de idea, toca "Yo voy".');break}
    case'callp':t.classList.toggle('on');{const n=document.querySelectorAll('#n-p .on').length;$('#n-cnt').textContent=n+' jugador'+(n===1?'':'es')}break;
    case'callall':document.querySelectorAll('#n-p button').forEach(b=>b.classList.toggle('on',t.dataset.v==='1'));{const n=document.querySelectorAll('#n-p .on').length;$('#n-cnt').textContent=n+' jugador'+(n===1?'':'es')}break;
    case'createm':{const c=S.canchas.find(x=>x.id===$('#n-c .on')?.dataset.v);const f=$('#n-f').value;if(!c||!f){toast('Elige cancha y fecha');return}
      const m={id:'m'+uid(),fecha:f,hora:$('#n-h .on')?.dataset.v||'20:00',canchaId:c.id,fmt:c.formato,cupo:CUPO[c.formato],cuota:0,convocados:[],llamados:[...document.querySelectorAll('#n-p .on')].map(b=>b.dataset.id),nov:[],by:me().id,estado:'abierta',goals:[],board:{}};
      if(!m.llamados.length){toast('Elige al menos a un jugador');return}
      if(cierreDe(m)<=new Date()){toast('La fecha debe ser al menos en 2 días');return}
      S.matches.push(m);curMatch=m.id;save();page=null;tab='inicio';render();
      sheet(`<h2>CONVOCATORIA PUBLICADA</h2><p class="muted s" style="margin:4px 0 0">Ya les salió el llamado en la app. Avisa en el grupo para que entren a responder.</p><div style="white-space:pre-line;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;font-size:14px">${esc(shareText(m))}</div><a class="btn wa" href="${waLink(m)}" target="_blank" rel="noopener">Avisar en el grupo de WhatsApp</a><button class="btn gray" data-act="copy" data-t="${esc(shareText(m))}" data-msg="Mensaje copiado">Copiar mensaje</button><button class="btn link" data-act="bg">Listo</button>`);break}
    case'hintpitch':{const pt=document.getElementById('pitch');if(pt){pt.scrollIntoView({behavior:'smooth',block:'start'});pt.classList.remove('hint');void pt.offsetWidth;pt.classList.add('hint');setTimeout(()=>pt.classList.remove('hint'),2400)}break}
    case'share':{const m=M()||S.matches.find(x=>x.id===id);copy(shareText(S.matches.find(x=>x.id===id)));break}
    case'closeconv':{const m=S.matches.find(x=>x.id===id);sheet(`<h2>CERRAR CONVOCATORIA</h2><p class="muted s" style="margin:6px 0 0">Van ${m.convocados.length}. La cuota queda en <b>${cop(cuotaCalc(cancha(m).valor,m.convocados.length))}</b> (${cop(cancha(m).valor)} ÷ ${m.convocados.length}). Nadie más podrá entrar ni bajarse. Se paga al terminar el partido.</p><button class="btn navy" data-act="closeok" data-id="${m.id}">Cerrar y fijar cuota</button><button class="btn link" data-act="bg">Cancelar</button>`);break}
    case'closeok':{const m=S.matches.find(x=>x.id===id);closeConv(m);save();close();render();toast('Convocatoria cerrada. Cuota fijada.');break}
    case'newt':sheet(`<h2>NUEVO TORNEO</h2><p class="muted s" style="margin:4px 0 0">Cuenta partidos ganados por Negro y Blanco.</p><label class="f">Nombre<input class="i" id="t-n" placeholder="Ej. Torneo de diciembre"></label><label class="f">Empieza<input class="i" id="t-i" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="f">Semanas<input class="i" id="t-s" type="number" inputmode="numeric" value="6" min="1" max="52"></label><button class="btn navy" data-act="savet">Crear torneo</button>`);break;
    case'savet':{const n=$('#t-n').value.trim()||'Torneo';const i=$('#t-i').value;const w=Number($('#t-s').value)||6;if(!i){toast('Elige la fecha');return}S.torneos.push({id:'t'+uid(),nombre:n,inicio:i,semanas:w});filt='tor';save();close();render();toast('Torneo creado');break}
    case'tadmin':{const p=pl(id);p.admin=!p.admin;save();render();break}
  }
});
document.addEventListener('keydown',e=>{if($('#galTr')){if(e.key==='ArrowLeft')galGo(-1);if(e.key==='ArrowRight')galGo(1)}if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.id==='email')login(e.target.value)});
document.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Sube una imagen');return}
  try{if(e.target.id==='proofIn'){pd.proof=await shrink(f,900);drawPay()}if(e.target.id==='photoIn'){syncDraft();draft.foto=await shrink(f,360);const i=S.players.findIndex(p=>p.id===me().id);S.players[i].foto=draft.foto;save();render()}}catch(err){toast('No se pudo leer la imagen')}});
render();
}

try{if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname.endsWith('github.io'))navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
